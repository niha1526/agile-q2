apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-bookstore
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: online-bookstore
  template:
    metadata:
      labels:
        app: online-bookstore
    spec:
      containers:
        - name: bookstore
          image: niharikarao15/online-bookstore:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: online-bookstore-service
spec:
  type: NodePort
  selector:
    app: online-bookstore
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084